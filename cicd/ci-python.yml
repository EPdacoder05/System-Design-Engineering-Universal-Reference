# ============================================================================
# Python CI Pipeline Template (Modular)
# ============================================================================
# Copy this to your project's .github/workflows/ci.yml
#
# Jobs (run in parallel):
#   1. lint      — ruff linter with GitHub annotations
#   2. pylint    — pylint static analysis (score-gated, configurable threshold)
#   3. typecheck — mypy static type analysis
#   4. test      — pytest with coverage (multi-version matrix)
#   5. snyk      — Snyk open-source dependency vulnerability scan
#   6. scan      — placeholder for project-specific scans (PII, custom)
#
# Customize:
#   - Python versions in test matrix
#   - ruff rules in [tool.ruff] section of pyproject.toml
#   - mypy config in [tool.mypy] section of pyproject.toml
#   - pylint score gate via PYLINT_MIN_SCORE env var (default 8.0)
#   - Snyk severity threshold via SNYK_SEVERITY (default "high")
#
# Requires:
#   - pyproject.toml (see cicd/pyproject-template.toml)
#   - SNYK_TOKEN secret in repository / organization settings
# ============================================================================

name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYLINT_MIN_SCORE: "8.0"
  SNYK_SEVERITY: "high"

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run ruff linter
      run: |
        ruff check . --output-format=github

  pylint:
    name: Lint with pylint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pylint and project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run pylint
      run: |
        # Collect all Python source files (exclude virtual envs and test dirs)
        FILES=$(find . -name "*.py" \
          -not -path "./.git/*" \
          -not -path "./venv/*" \
          -not -path "./.venv/*" \
          | head -200)
        if [ -z "$FILES" ]; then
          echo "No Python files found."
          exit 0
        fi
        pylint $FILES \
          --output-format=colorized \
          --fail-under=${{ env.PYLINT_MIN_SCORE }} \
          --disable=C0114,C0115,C0116 \
          || true
      # Note: `|| true` prevents a pylint score below threshold from blocking
      # the pipeline until the codebase reaches a stable baseline.
      # Remove `|| true` once the score consistently meets PYLINT_MIN_SCORE.
      continue-on-error: true

  typecheck:
    name: Type check with mypy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy
    
    - name: Run mypy type checker
      run: |
        mypy . --ignore-missing-imports
      continue-on-error: true

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v
    
    - name: Upload coverage reports
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: coverage.xml
        retention-days: 30

  snyk:
    name: Snyk dependency vulnerability scan
    runs-on: ubuntu-latest
    # Requires SNYK_TOKEN secret — add via repo Settings > Secrets and variables
    # https://docs.snyk.io/snyk-api/authentication-for-api

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies for Snyk
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: >
          --severity-threshold=${{ env.SNYK_SEVERITY }}
          --file=requirements.txt
      continue-on-error: true
      # Note: `continue-on-error: true` keeps the pipeline green while teams
      # triage findings.  Set to `false` once all HIGH/CRITICAL issues are
      # resolved to enforce a hard gate.

    - name: Upload Snyk results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('snyk.sarif') != ''
      with:
        sarif_file: snyk.sarif
        category: snyk-oss
      continue-on-error: true

  scan:
    name: Custom project scans
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Run custom scans
      run: |
        # Add project-specific scans here. Examples:
        # python scripts/pii_scanner.py  # PII/secrets scan
        # python -m safety check          # Dependency vulnerability scan
        echo "No custom scans configured. Add your scan commands here."

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, pylint, typecheck, test, snyk, scan]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint (ruff) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lint (pylint) | ${{ needs.pylint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Snyk | ${{ needs.snyk.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Scan | ${{ needs.scan.result }} |" >> $GITHUB_STEP_SUMMARY
