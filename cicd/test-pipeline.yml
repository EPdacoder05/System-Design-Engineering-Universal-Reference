name: Unified PR CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  PYTHON_DEFAULT: "3.12"
  NODE_DEFAULT: "20"

jobs:
  python_lint:
    name: Python lint (ruff)
    if: hashFiles('**/*.py') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python files
        run: ruff check . --output-format=github

  python_typecheck:
    name: Python type-check (mypy)
    if: hashFiles('**/*.py') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install mypy and project dependencies
        shell: bash
        run: |
          pip install mypy
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Run mypy
        run: mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true

  python_test:
    name: Python tests (${{ matrix.python-version }})
    if: hashFiles('**/*.py') != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi
          pip install pytest pytest-asyncio pytest-cov

      - name: Run pytest when tests exist
        shell: bash
        run: |
          if find . -type f \( -path './tests/*' -o -path './testing/*' -o -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest --cov=. --cov-report=xml --cov-report=term-missing -v
          else
            echo "No pytest tests detected; skipping."
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Coverage comment on PR
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
        continue-on-error: true

  python_security:
    name: Python security (bandit + pip-audit)
    if: hashFiles('**/*.py') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install security tooling
        run: pip install bandit[toml] pip-audit

      - name: Run bandit
        run: bandit -r . -ll --exclude ./.venv,./venv
        continue-on-error: true

      - name: Run pip-audit when requirements.txt exists
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc on
          else
            echo "No requirements.txt found; skipping pip-audit."
          fi
        continue-on-error: true

  node_security:
    name: Node security (npm audit)
    if: hashFiles('**/package.json') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Install dependencies and audit
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          else
            echo "No package-lock.json found; skipping npm audit."
          fi
        continue-on-error: true

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker_hardening:
    name: Docker hardening + build
    if: hashFiles('Dockerfile', 'cicd/Dockerfile') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=cicd/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce baseline hardening
        shell: bash
        run: |
          DOCKERFILE="${{ steps.dockerfile.outputs.path }}"

          if grep -Eq '^FROM .+:latest([[:space:]]|$)' "$DOCKERFILE"; then
            echo "::error::$DOCKERFILE uses :latest. Pin an explicit version or digest."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*USER[[:space:]]+' "$DOCKERFILE"; then
            echo "::error::$DOCKERFILE is missing a non-root USER directive."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*HEALTHCHECK[[:space:]]+' "$DOCKERFILE"; then
            echo "::error::$DOCKERFILE is missing a HEALTHCHECK."
            exit 1
          fi

          if ! grep -Eq '^FROM .+@sha256:' "$DOCKERFILE"; then
            echo "::warning::$DOCKERFILE should pin base images by digest when promoting to release."
          fi

      - name: Build image
        run: docker build -f "${{ steps.dockerfile.outputs.path }}" -t ci-image:${{ github.sha }} .

  ci_summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - python_lint
      - python_typecheck
      - python_test
      - python_security
      - node_security
      - gitleaks
      - docker_hardening
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Unified PR CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy this file to .github/workflows/ci.yml for one consolidated PR check suite." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python lint | ${{ needs.python_lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python type-check | ${{ needs.python_typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python tests | ${{ needs.python_test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python security | ${{ needs.python_security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node security | ${{ needs.node_security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitleaks | ${{ needs.gitleaks.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker hardening + build | ${{ needs.docker_hardening.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker hardening baseline: no :latest, non-root USER, HEALTHCHECK, digest pinning recommended, build must succeed." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on blocking jobs
        if: >
          needs.python_lint.result == 'failure' ||
          needs.python_test.result == 'failure' ||
          needs.gitleaks.result == 'failure' ||
          needs.docker_hardening.result == 'failure'
        run: |
          echo "Blocking CI jobs failed."
          exit 1
