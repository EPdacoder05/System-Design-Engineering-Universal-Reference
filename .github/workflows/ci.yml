# ============================================================================
# Unified Parallel CI
# ============================================================================
# All quality-gate jobs run in parallel under a single workflow so that every
# PR shows one check-suite, not a sprawl of separate workflows.
#
# Jobs (parallel):
#   lint       — ruff linter (fast, always required)
#   typecheck  — mypy static type analysis
#   test       — pytest with coverage (3.11 + 3.12 matrix)
#   bandit     — Python security linter (medium+ severity)
#   pip-audit  — CVE scan on requirements.txt
#
# Gate:
#   ci-summary — collects all results; fails the PR if any required job fails
# ============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed by the coverage comment action

env:
  PYTHON_DEFAULT: "3.12"

# ============================================================================
# lint — ruff (fast gate)
# ============================================================================
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install ruff
        run: pip install ruff

      - name: Determine Python lint targets
        id: lint-targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES="$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" -- '*.py')"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.py')"
          else
            FILES="$(git ls-files '*.py')"
          fi

          FILES="$(echo "$FILES" | tr '\n' ' ' | xargs || true)"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: ruff check
        shell: bash
        run: |
          if [ -z "${{ steps.lint-targets.outputs.files }}" ]; then
            echo "No Python changes detected; skipping lint."
            exit 0
          fi

          ruff check ${{ steps.lint-targets.outputs.files }} --output-format=github

# ============================================================================
# typecheck — mypy
# ============================================================================
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install mypy + stubs
        run: |
          pip install mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt --quiet; fi

      - name: mypy
        run: mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true   # advisory until type coverage is complete

# ============================================================================
# test — pytest (3.11 + 3.12 matrix)
# ============================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Coverage comment on PR (3.12 only)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
        continue-on-error: true

# ============================================================================
# bandit — Python security linter
# ============================================================================
  bandit:
    name: Security lint (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: bandit scan
        run: bandit -r . -ll --exclude ./.venv,./venv
        continue-on-error: true   # advisory; findings surfaced in ci-summary

      - name: bandit JSON report
        if: always()
        run: bandit -r . -f json -o bandit-report.json --severity-level medium --exclude ./.venv,./venv || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

# ============================================================================
# pip-audit — CVE scan on requirements.txt
# ============================================================================
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit scan
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc on
          else
            echo "No requirements.txt found — skipping."
          fi
        continue-on-error: true   # advisory

      - name: pip-audit JSON report
        if: always()
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
          fi

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

# ============================================================================
# ci-summary — aggregate gate (fails PR if lint or test fail)
# ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, bandit, pip-audit]
    if: always()

    steps:
      - name: Write step summary
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (ruff)        | ${{ needs.lint.result }} |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| Type-check (mypy)  | ${{ needs.typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests (pytest)     | ${{ needs.test.result }} |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| Security (bandit)  | ${{ needs.bandit.result }} |"    >> "$GITHUB_STEP_SUMMARY"
          echo "| Deps (pip-audit)   | ${{ needs.pip-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if lint or tests failed
        if: >
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure'
        run: |
          echo "Required jobs failed — see summary above."
          exit 1
